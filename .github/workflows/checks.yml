name: Verificar NFC Office

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revisar sintaxis de Python
        run: python -m compileall -q server.py domain.py security.py tests
      - name: Ejecutar pruebas del servidor y agentes
        run: python -m unittest discover -s tests -v
      - name: Revisar sintaxis JavaScript
        run: |
          node --check web/app.js
          node --check web/office.js
